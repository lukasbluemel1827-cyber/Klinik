<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Klinikdienst</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: Dienstplan als Spalte. Karte mit Schiene, Patientenakte oben, dunkler Patientenmonitor darunter. */
:root{
  --bg:#edf1ef; --surface:#ffffff; --surface2:#e2eae7; --ink:#12201d; --ink2:#4e5f5a; --line:#c9d5d1;
  --scrub:#13806b; --scrub-ink:#ffffff; --alert:#d23c33; --amber:#b87d00; --ok:#1c8f52; --coin:#b98a00;
  --mon:#08140f; --mon-ink:#63f0b0; --mon-dim:#7fb9a3; --mon-red:#ff6b61; --mon-amb:#f2b632;
  --f-display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --f-body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'Share Tech Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1311; --surface:#141f1c; --surface2:#1d2c28; --ink:#e6f0ed; --ink2:#97aba5; --line:#2b3c37;
    --scrub:#2bb89c; --scrub-ink:#04201a; --alert:#ff6b61; --amber:#f2b632; --ok:#47d58a; --coin:#f2c230;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1311; --surface:#141f1c; --surface2:#1d2c28; --ink:#e6f0ed; --ink2:#97aba5; --line:#2b3c37;
  --scrub:#2bb89c; --scrub-ink:#04201a; --alert:#ff6b61; --amber:#f2b632; --ok:#47d58a; --coin:#f2c230;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--ink); font:400 15px/1.45 var(--f-body);
  padding-block:10px 100px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;
}
body[data-mode="play"]{padding-bottom:28px}
body[data-mode="play"] #nav, body[data-mode="play"] #top{display:none}
#app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.15}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--scrub);outline-offset:2px}
button:disabled{cursor:default}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2);font-weight:700}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Kopfzeile */
#top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:6px 0 4px}
.brand{min-width:0;flex:1}
.brand h1{font-size:24px;font-weight:800;letter-spacing:-.01em}
.rankline{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:13px;color:var(--ink2)}
.rankline b{color:var(--ink);font-weight:700;white-space:nowrap}
.xp{flex:1;min-width:48px;max-width:140px;height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}
.xp i{display:block;height:100%;background:var(--scrub)}
.hud{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.coin{display:flex;align-items:center;gap:7px;font:400 18px/1 var(--f-mono);background:var(--mon);color:var(--mon-ink);padding:7px 11px;border-radius:8px;font-variant-numeric:tabular-nums}
.coin::before{content:"";width:11px;height:11px;border-radius:50%;background:#f2c230;box-shadow:inset 0 0 0 2px #b98a00}
.link{background:none;border:0;padding:2px 0;font-size:12px;color:var(--ink2);text-decoration:underline;text-underline-offset:3px}

/* Buttons */
.primary{width:100%;background:var(--scrub);color:var(--scrub-ink);border:0;border-radius:12px;padding:14px 16px;font-weight:700;font-size:16px}
.primary:active{transform:translateY(1px)}
.primary:disabled{opacity:.45}
.ghost{background:transparent;border:1.5px solid var(--line);border-radius:10px;padding:10px 14px;font-weight:500;color:var(--ink)}
.ghost.sm{padding:6px 10px;font-size:13px}
.screen{display:flex;flex-direction:column;gap:14px}
.screen[hidden]{display:none!important}
.lead{margin:0;color:var(--ink2)}

/* Dienstplan / Karte */
.howto{border:1.5px dashed var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.howto p{margin:0}
.howto b{font-family:var(--f-display)}
.rail{display:flex;flex-direction:column;position:relative}
.rail::before{content:"";position:absolute;left:21px;top:20px;bottom:20px;width:2px;background:var(--line)}
.lv{position:relative;display:grid;grid-template-columns:44px 1fr;gap:12px;text-align:left;background:none;border:0;padding:8px 0;width:100%;align-items:center}
.lv .no{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px solid var(--scrub);font:400 19px/1 var(--f-mono);color:var(--scrub);z-index:1}
.lv.done .no{background:var(--scrub);color:var(--scrub-ink)}
.lv:disabled .no{border-color:var(--line);color:var(--ink2)}
.lv .bd{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.lv:not(:disabled):active .bd{transform:translateY(1px)}
.lv:disabled .bd{opacity:.55}
.lv .nm{font-family:var(--f-display);font-weight:800;font-size:17px}
.lv .sb{font-size:13px;color:var(--ink2)}
.lv .meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:3px;font-size:12px;color:var(--ink2)}
.tag{border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-weight:700;letter-spacing:.03em;font-size:11px;text-transform:uppercase}
.tag.boss{border-color:var(--alert);color:var(--alert)}
.stars{display:inline-flex;gap:2px}
.stars svg{width:15px;height:15px;fill:var(--surface2);stroke:var(--line)}
.stars svg.on{fill:var(--coin);stroke:var(--coin)}
.foot{font-size:12px;color:var(--ink2);margin:6px 0 0}

/* Shop */
.item{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.badge{width:48px;height:48px;border-radius:10px;background:var(--mon);color:var(--mon-ink);display:grid;place-items:center;font:400 20px/1 var(--f-mono)}
.item .tx{min-width:0}
.item b{font-family:var(--f-display);font-size:16px}
.item p{margin:2px 0 6px;font-size:13px;color:var(--ink2)}
.pips{display:flex;gap:4px}
.pips i{width:18px;height:6px;border-radius:3px;background:var(--surface2)}
.pips i.on{background:var(--scrub)}
.buy{border:0;border-radius:10px;background:var(--scrub);color:var(--scrub-ink);font-weight:700;padding:10px 12px;min-width:76px;font-variant-numeric:tabular-nums}
.buy:disabled{background:var(--surface2);color:var(--ink2)}

/* Lexikon */
.lexgrp{display:flex;flex-direction:column;gap:6px}
.lexgrp h3{font-size:15px;color:var(--ink2);margin-top:6px}
details.le{border:1px solid var(--line);border-radius:10px;background:var(--surface)}
details.le summary{padding:11px 12px;font-weight:700;cursor:pointer;list-style:none}
details.le summary::-webkit-details-marker{display:none}
details.le p{margin:0;padding:0 12px 12px;color:var(--ink2)}
.le.lock{padding:11px 12px;border:1px dashed var(--line);border-radius:10px;color:var(--ink2)}

/* Spiel */
.gtop{display:flex;align-items:center;justify-content:space-between;gap:10px}
.gt{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0;flex:1}
.gt b{font-family:var(--f-display);font-size:14px;text-align:center}
.dots{display:flex;gap:5px}
.dots i{width:16px;height:5px;border-radius:3px;background:var(--surface2)}
.dots i.d{background:var(--scrub)}
.dots i.c{background:var(--ink2)}
.hearts{display:flex;gap:2px}
.hearts svg{width:19px;height:19px;fill:var(--surface2)}
.hearts svg.on{fill:var(--alert)}
.timer{position:relative;height:22px;border-radius:6px;background:var(--surface2);overflow:hidden}
#tbar{height:100%;width:100%;background:var(--scrub)}
#tbar.low{background:var(--alert)}
#tnum{position:absolute;right:8px;top:0;line-height:22px;font:400 13px/22px var(--f-mono);color:var(--ink)}
#gMain{display:flex;flex-direction:column;gap:12px}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:12px 12px 0 0;padding:12px 14px;display:flex;flex-direction:column;gap:6px;margin-bottom:-12px}
.chart b{font-family:var(--f-display);font-size:17px}
.chart .compl{margin:0}
.monitor{background:var(--mon);border-radius:0 0 12px 12px;overflow:hidden;margin-top:0}
.monitor canvas{display:block;width:100%;height:58px}
.vit{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid #1d3a2f}
.v{padding:8px 6px;text-align:center;border-left:1px solid #1d3a2f;color:var(--mon-ink);display:flex;flex-direction:column;gap:1px;min-width:0}
.v:first-child{border-left:0}
.v small{font-size:11px;letter-spacing:.06em;color:var(--mon-dim);text-transform:uppercase}
.v b{font:400 20px/1.1 var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.v i{font-style:normal;font-size:10px;color:var(--mon-dim)}
.v.red{color:var(--mon-red)}
.v.amb{color:var(--mon-amb)}
.panel{display:flex;flex-direction:column;gap:8px}
.panel h3{font-size:17px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.cnt{font:400 14px var(--f-mono);color:var(--ink2)}
.exam,.opt,.tri{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;min-height:50px}
.exam b{font-weight:700}
.exam span{font-size:13px;color:var(--ink2)}
.exam.done{border-color:var(--scrub)}
.exam.done span{color:var(--ink)}
.exam:disabled:not(.done){opacity:.45}
.opt{justify-content:center;font-weight:500}
.opt.gone{opacity:.3;text-decoration:line-through}
.finds{border-left:3px solid var(--scrub);padding:2px 0 2px 12px;display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--ink2)}
.finds b{color:var(--ink)}
.fb{border-radius:12px;border:1.5px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.fb.ok{border-color:var(--ok)}
.fb.amb{border-color:var(--amber)}
.fb.bad{border-color:var(--alert)}
.fb h3{font-size:19px}
.fb.ok h3{color:var(--ok)}
.fb.amb h3{color:var(--amber)}
.fb.bad h3{color:var(--alert)}
.fb p{margin:0}
.fb .why{color:var(--ink2);font-size:14px}
.gain{font:400 15px var(--f-mono);color:var(--coin)}

/* Triage */
.tri{position:relative;padding-right:56px;font-weight:500}
.tri .bdg{position:absolute;right:12px;top:50%;transform:translateY(-50%);min-width:34px;height:34px;border-radius:17px;display:none;place-items:center;font:400 18px var(--f-mono);color:#fff;padding:0 8px;white-space:nowrap}
.tri.on{opacity:.9}
.tri.on .bdg{display:grid}
.tri.c0 .bdg,.tri.c1 .bdg{background:#c62f27}
.tri.c2 .bdg{background:#cf6a00}
.tri.c3 .bdg{background:#9a7a00}
.tri.c4 .bdg{background:#1c8f52}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.catlist{display:flex;flex-direction:column;gap:4px;font-size:14px}
.cat{display:inline-block;min-width:104px;font-weight:700}

/* Dosierung */
.dose{display:flex;flex-direction:column;gap:12px;align-items:stretch}
.dose .q{font-size:17px;margin:0}
.dval{font:400 44px/1 var(--f-mono);text-align:center;background:var(--mon);color:var(--mon-ink);border-radius:12px;padding:16px 8px;font-variant-numeric:tabular-nums}
.dval small{font-size:18px;color:var(--mon-dim);margin-left:6px}
.dctl{display:grid;grid-template-columns:56px 1fr 56px;gap:10px;align-items:center}
.dctl button{height:56px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font:400 26px var(--f-mono)}
.dctl input{width:100%;height:44px;accent-color:var(--scrub)}
.note{font-size:12px;color:var(--ink2);margin:0}

/* Reanimation */
.cpr{display:flex;flex-direction:column;align-items:center;gap:14px}
.cprbtn{position:relative;width:200px;height:200px;border-radius:50%;border:0;background:var(--alert);color:#fff;font:800 24px var(--f-display);box-shadow:0 6px 0 rgba(0,0,0,.25);user-select:none;-webkit-user-select:none;touch-action:manipulation}
.cprbtn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.cprwrap{position:relative;width:240px;height:240px;display:grid;place-items:center}
.ring{position:absolute;inset:0;border-radius:50%;border:3px solid var(--alert);opacity:.0;animation:ring .5455s ease-out infinite;pointer-events:none}
@keyframes ring{0%{transform:scale(.84);opacity:.9}100%{transform:scale(1);opacity:0}}
.cstats{display:grid;grid-template-columns:repeat(3,1fr);width:100%;background:var(--mon);border-radius:12px;overflow:hidden}
.cstats .v{padding:10px 6px}
.qbar{width:100%;height:10px;border-radius:5px;background:var(--surface2);overflow:hidden}
.qbar i{display:block;height:100%;width:0;background:var(--scrub)}

/* Ergebnis */
.res{display:flex;flex-direction:column;gap:14px;align-items:stretch}
.res h2{font-size:26px;font-weight:800}
.bigstars{display:flex;gap:8px}
.bigstars svg{width:44px;height:44px;fill:var(--surface2);stroke:var(--line);stroke-width:1}
.bigstars svg.on{fill:var(--coin);stroke:var(--coin)}
.rows{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.rows div{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.rows b{font-family:var(--f-mono);font-weight:400;font-variant-numeric:tabular-nums}
.best{font:400 15px var(--f-mono);color:var(--ink2)}

/* Navigation */
#nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding:0 max(8px,env(safe-area-inset-left,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-right,0px));z-index:5}
#nav div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
#nav button{background:none;border:0;border-top:3px solid transparent;padding:14px 4px 13px;font-weight:700;font-size:13px;color:var(--ink2)}
#nav button[aria-current="page"]{color:var(--scrub);border-top-color:var(--scrub)}
#nav button.lockd{opacity:.5}

@media (prefers-reduced-motion: reduce){
  .shake{animation:none}
}
</style>

</head>
<body>
<div id="app">
  <header id="top"></header>
  <section class="screen" id="s-map"></section>
  <section class="screen" id="s-shop" hidden></section>
  <section class="screen" id="s-lex" hidden></section>
  <section class="screen" id="s-endless" hidden></section>
  <section class="screen" id="s-game" hidden></section>
  <section class="screen" id="s-result" hidden></section>
</div>
<nav id="nav" aria-label="Hauptmenü"><div>
  <button data-act="tab" data-v="map">Dienst</button>
  <button data-act="tab" data-v="shop">Ausstattung</button>
  <button data-act="tab" data-v="lex">Lexikon</button>
  <button data-act="tab" data-v="endless">Endlos</button>
</div></nav>

function $(id){return document.getElementById(id);}
function rnd(n){return Math.floor(Math.random()*n);}
function shuffle(a){var b=a.slice();for(var i=b.length-1;i>0;i--){var j=rnd(i+1);var t=b[i];b[i]=b[j];b[j]=t;}return b;}

function beep(f,d,v){
  if(S.mute)return;

    o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(v||0.06,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);
  }catch(e){}
}

/* ---------- Spielablauf ---------- */
function newSession(mode,lvl){
  var mh=3+upLv('kaffee');
  return {mode:mode,lvl:lvl,tasks:[],ti:0,hearts:mh,maxHearts:mh,mistakes:0,coins:0,xp:0,saved:0,total:0,hints:upLv('buch'),over:false,seen:[],pool:[],rank0:rankOf(S.xp),tl:0,P:null,M:null};
}
function startLevel(n){
  var L=LEVELS[n-1];G=newSession('level',n);
  for(var k=0;k<3;k++){G.tasks.push({t:'case',i:(n-1)*3+k});}
  var b=L.boss||[];for(var j=0;j<b.length;j++){G.tasks.push({t:b[j]});}
  show('game');nextTask();
}
function startEndless(){
  if(unlockedLevels()<3)return;
  G=newSession('endless',0);
  var n=unlockedLevels();
  for(var l=0;l<n;l++){for(var k=0;k<3;k++){G.pool.push(l*3+k);}}
  show('game');nextTask();
}
function pickEndless(){
  var av=G.pool.filter(function(i){return G.seen.indexOf(i)<0;});
  if(!av.length){G.seen=[];av=G.pool.slice();}
  var i=av[rnd(av.length)];G.seen.push(i);return i;
}
function nextTask(){
  stopAll();window.scrollTo(0,0);
  if(G.mode==='level'){
    if(G.ti>=G.tasks.length){finishLevel();return;}
    var t=G.tasks[G.ti];
    if(t.t==='case')runCase(t.i);else if(t.t==='triage')runTriage();else if(t.t==='dosis')runDosis();else runCpr();
  }else{runCase(pickEndless());}
}
function afterTask(){
  G.ti++;
  if(G.over){endRun();return;}
  nextTask();
}
function shell(label,inner,withTimer){
  var prog='';
  if(G.mode==='level'){for(var k=0;k<G.tasks.length;k++){prog+='<i class="'+(k<G.ti?'d':(k===G.ti?'c':''))+'"></i>';}}
  return '<div class="gtop"><button class="ghost sm" data-act="quit">Beenden</button><div class="gt"><b>'+label+'</b><div class="dots">'+prog+'</div></div><div class="hearts" id="hearts" role="img" aria-label="'+G.hearts+' von '+G.maxHearts+' Herzen">'+heartsHtml()+'</div></div>'+
    (withTimer?'<div class="timer"><div id="tbar"></div><span id="tnum"></span></div>':'')+'<div id="gMain">'+inner+'</div>';
}

/* Timer */
var TM=null;
function startTimer(sec,onEnd){
  stopTimer();var t0=performance.now();G.tl=sec;
  TM=setInterval(function(){
    var left=Math.max(0,sec-(performance.now()-t0)/1000);G.tl=left;
    var b=$('tbar');if(b){b.style.width=(left/sec*100)+'%';if(left/sec<0.25)b.className='low';}
    var n=$('tnum');if(n)n.textContent=Math.ceil(left)+' s';
    if(left<=0){stopTimer();onEnd();}
  },100);

}

/* EKG */
var ecgRAF=0,ecgHR=70;
function stopEcg(){if(ecgRAF){cancelAnimationFrame(ecgRAF);ecgRAF=0;}}
function gauss(x,m,s,a){return a*Math.exp(-((x-m)*(x-m))/(2*s*s));}
function wave(p){return gauss(p,0.16,0.03,0.12)+gauss(p,0.36,0.008,-0.12)+gauss(p,0.385,0.01,1)+gauss(p,0.415,0.01,-0.22)+gauss(p,0.62,0.05,0.22);}
function startEcg(hr){
  stopEcg();ecgHR=hr;
  var cv=$('ecg');if(!cv)return;
  var ctx=cv.getContext('2d');
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function frame(ts){
    var d=window.devicePixelRatio||1;
    var w=Math.round(cv.clientWidth*d),h=Math.round(cv.clientHeight*d);
    if(cv.width!==w)cv.width=w;if(cv.height!==h)cv.height=h;
    ctx.clearRect(0,0,w,h);ctx.lineWidth=2*d;ctx.lineJoin='round';ctx.strokeStyle='#63f0b0';ctx.beginPath();
    var spd=120*d,per=60/ecgHR,now=ts/1000;
    for(var x=0;x<w;x+=2){
      var tt=now-(w-x)/spd,p=(tt/per)%1;if(p<0)p+=1;
      var y=h*0.74-wave(p)*h*0.62;
      if(x===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
    }
    ctx.stroke();
    if(!reduce)ecgRAF=requestAnimationFrame(frame);
  }
  ecgRAF=requestAnimationFrame(frame);
}

function vitalsHtml(c){
  var hr=c.v[0],s=c.v[1],d=c.v[2],t=c.v[3],o=c.v[4];
  var rows=[
    ['HF',hr,'/min',(hr>=130||hr<45)?'red':((hr>100||hr<55)?'amb':'')],
    ['RR',s+'/'+d,'mmHg',(s<90||s>180)?'red':((s<100||s>150)?'amb':'')],
    ['Temp',fmt(t.toFixed(1)),'°C',(t>=39.5||t<35)?'red':(t>=38?'amb':'')],
    ['SpO2',o,'%',o<90?'red':(o<95?'amb':'')]
  ];
  return rows.map(function(r){return '<div class="v '+r[3]+'"><small>'+r[0]+'</small><b>'+r[1]+'</b><i>'+r[2]+'</i></div>';}).join('');
}
function timeFor(){
  var base=G.mode==='level'?Math.max(40,75-G.lvl*2):Math.max(30,60-G.saved);
  return base+upLv('steth')*8;
}
function runCase(i){
  var c=CASES[i];
  var P={i:i,phase:'exam',done:{},picks:2+upLv('us')+((G.mode==='level'&&G.lvl===1)?1:0),hide:{},kind:'',gain:0};
  P.dxo=shuffle(c.dx.map(function(t,k){return {t:t,ok:k===0};}));
  P.txo=shuffle(c.tx.map(function(t,k){return {t:t,ok:k===0};}));
  G.P=P;
  var inner='<div><article class="chart"><span class="eyebrow">Patientenakte · '+deptOf(i)+'</span><b>'+c.who+'</b><p class="compl">'+c.c+'</p></article>'+
    '<div class="monitor" aria-label="Patientenmonitor"><canvas id="ecg" aria-hidden="true"></canvas><div class="vit">'+vitalsHtml(c)+'</div></div></div><div id="gBody"></div>';
  $('s-game').innerHTML=shell(label(),inner,true);
  startEcg(c.v[0]);
  renderBody();
  startTimer(timeFor(),function(){resolveCase('timeout');});
}
function findsHtml(){
  var c=CASES[G.P.i],P=G.P,out=[];

  return out.length?'<div class="finds">'+out.join('')+'</div>':'';
}
function usedPicks(){var n=0;for(var k in G.P.done){if(G.P.done[k])n++;}return n;}
function renderBody(){

    }
    h+='</div><button class="primary" data-act="todx">Diagnose stellen</button>';
  }else if(P.phase==='dx'){
    h+=findsHtml()+'<div class="panel"><h3>Was ist die Diagnose?</h3>';
    for(var a=0;a<P.dxo.length;a++){
      var gone=!!P.hide[a];

    }

    h+='</div>';
  }else if(P.phase==='tx'){

    for(var b=0;b<P.txo.length;b++){
      h+='<button class="opt" data-act="tx" data-k="'+b+'">'+P.txo[b].t+'</button>';
    }
    h+='</div>';
  }else{
    var cls={win:'ok',txwrong:'amb',dxwrong:'bad',timeout:'bad'}[P.kind];
    var ttl={win:'Patient gerettet',txwrong:'Diagnose richtig, Therapie falsch',dxwrong:'Falsche Diagnose',timeout:'Zeit abgelaufen'}[P.kind];
    h+='<div class="fb '+cls+'"><h3>'+ttl+'</h3><p><b>Diagnose:</b> '+c.dx[0]+'</p><p><b>Therapie:</b> '+c.tx[0]+'</p><p class="why">'+c.why+'</p><span class="gain">+'+P.gain+' Münzen</span></div>';
    h+='<button class="primary" data-act="next">'+(G.over?'Ergebnis anzeigen':'Weiter')+'</button>';
  }
  $('gBody').innerHTML=h;
}
function resolveCase(kind){
  stopTimer();var P=G.P;if(P.phase==='fb')return;
  P.phase='fb';P.kind=kind;
  var gain=0,xp=0;
  if(kind==='win'){gain=15+Math.floor(G.tl/4);xp=20;G.saved++;beep(660,0.12);setTimeout(function(){beep(880,0.18);},120);}
  else if(kind==='txwrong'){gain=5;xp=8;lose();}
  else if(kind==='dxwrong'){xp=2;lose();}
  else{lose();}
  P.gain=reward(gain,xp);
  S.lex[P.i]=1;G.total++;save();
  renderBody();
  window.scrollTo(0,document.body.scrollHeight);
}

/* ---------- Triage ---------- */
function runTriage(){
  var set=TRI[rnd(TRI.length)];
  var items=shuffle(set.map(function(t,r){return {t:t,r:r};}));
  G.M={kind:'triage',items:items,next:0,pen:false};
  var h='<div class="panel"><h3>Triage</h3><p class="lead">Fünf Patienten warten. Tippe sie in der Reihenfolge der Dringlichkeit an, der kritischste zuerst.</p>';
  for(var k=0;k<items.length;k++){
    h+='<button class="tri c'+items[k].r+'" data-act="tri" data-r="'+items[k].r+'"><span>'+items[k].t+'</span><span class="bdg"></span></button>';
  }
  h+='</div><div id="gBody"></div>';
  $('s-game').innerHTML=shell(label(),h,false);
}
function triTap(b){
  var M=G.M;if(!M||M.kind!=='triage'||b.classList.contains('on'))return;
  var r=+b.getAttribute('data-r');
  if(r===M.next){
    b.classList.add('on');b.querySelector('.bdg').textContent=(M.next+1);b.disabled=true;
    M.next++;beep(520+M.next*60,0.08);
    if(M.next===5)finishMini(!M.pen,'Triage geschafft','Triage mit Fehlern','Gesichtet wird nach Lebensgefahr: zuerst Atemweg, Atmung und Kreislauf (ABCDE), dann Schmerz und Begleitumstände.',triSummary());
  }else{
    b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');
    if(!M.pen){M.pen=true;lose();}else{beep(170,0.2,0.06);}
  }
}
function triSummary(){
  var set=G.M.items.slice().sort(function(a,b){return a.r-b.r;});
  return '<div class="catlist">'+set.map(function(it){return '<div><span class="cat">'+(it.r+1)+'. '+TRICAT[it.r]+'</span>'+it.t+'</div>';}).join('')+'</div>';
}
function finishMini(ok,okTitle,badTitle,why,extra){
  var gain=reward(ok?25:10,ok?25:10);
  G.total++;
  var cls=ok?'ok':'amb';
  var h=$('gBody');
  h.innerHTML='<div class="fb '+cls+'"><h3>'+(ok?okTitle:badTitle)+'</h3>'+(extra||'')+'<p class="why">'+why+'</p><span class="gain">+'+gain+' Münzen</span></div><button class="primary" data-act="next">'+(G.over?'Ergebnis anzeigen':'Weiter')+'</button>';
  if(ok){beep(660,0.12);setTimeout(function(){beep(880,0.18);},120);}
  window.scrollTo(0,document.body.scrollHeight);
}

/* ---------- Dosierung ---------- */
function pick(a){return a[rnd(a.length)];}
function genDose(r){
  var w,x,n,d,c,ans,q,unit,step,max,expl;
  if(r===0){
    w=pick([8,10,12,15,18,20,24]);x=pick([5,10,15,20]);ans=w*x;unit='mg';step=5;
    q='Kind, '+w+' kg. Verordnet: '+x+' mg pro kg Körpergewicht als Einzeldosis. Wie viel mg gibst du?';
    expl=w+' kg × '+x+' mg/kg = '+ans+' mg';
  }else if(r===1){
    var ok=false;
    while(!ok){w=pick([10,12,15,20,24]);x=pick([30,40,60]);n=pick([2,3,4]);ans=w*x/n;ok=(ans%5===0&&ans<=500);}
    unit='mg';step=5;
    q='Kind, '+w+' kg. Tagesdosis laut Arzt: '+x+' mg pro kg, verteilt auf '+n+' Gaben. Wie viel mg pro Gabe?';
    expl=w+' kg × '+x+' mg/kg = '+(w*x)+' mg pro Tag, geteilt durch '+n+' = '+ans+' mg';
  }else{
    d=pick([25,50,75,100,150]);c=pick([25,50]);ans=d/c;unit='ml';step=0.5;
    q='Die Ampulle enthält '+c+' mg pro ml. Verordnet sind '+d+' mg. Wie viele ml ziehst du auf?';
    expl=d+' mg ÷ '+c+' mg/ml = '+fmt(ans)+' ml';
  }
  max=unit==='ml'?10:Math.max(100,Math.ceil(ans*2/50)*50);
  return {q:q,ans:ans,unit:unit,step:step,max:max,expl:expl};
}
function runDosis(){
  G.M={kind:'dosis',round:0,right:0,pen:false,cur:genDose(0),locked:false,val:0};
  $('s-game').innerHTML=shell(label(),'<div id="gBody"></div>',false);
  renderDose();
}
function renderDose(){
  var M=G.M,q=M.cur;
  $('gBody').innerHTML='<div class="dose"><div class="panel"><h3>Dosierung <span class="cnt">Aufgabe '+(M.round+1)+'/3</span></h3></div><p class="q">'+q.q+'</p>'+
    '<div class="dval" id="dval" aria-live="polite">'+fmt(M.val)+'<small>'+q.unit+'</small></div>'+
    '<div class="dctl"><button data-act="dminus" aria-label="weniger">−</button><input type="range" id="dr" min="0" max="'+q.max+'" step="'+q.step+'" value="'+M.val+'" aria-label="Menge"><button data-act="dplus" aria-label="mehr">+</button></div>'+
    '<button class="primary" data-act="dok">Bestätigen</button><p class="note">Rechenaufgabe mit einem erfundenen Präparat. Keine Dosierungsempfehlung.</p></div>';
  var r=$('dr');
  r.addEventListener('input',function(){G.M.val=+r.value;$('dval').firstChild.nodeValue=fmt(G.M.val);});
}
function doseStep(dir){
  var M=G.M,q=M.cur,v=M.val+dir*q.step;
  v=Math.max(0,Math.min(q.max,Math.round(v*100)/100));M.val=v;
  var r=$('dr');if(r)r.value=v;$('dval').firstChild.nodeValue=fmt(v);
}
function doseOk(){
  var M=G.M,q=M.cur;if(M.locked)return;M.locked=true;
  var ok=Math.abs(M.val-q.ans)<0.001;
  if(ok){M.right++;beep(740,0.12);}else{if(!M.pen){M.pen=true;lose();}else{beep(170,0.2,0.06);}}
  var last=M.round>=2;
  $('gBody').innerHTML='<div class="dose"><p class="q">'+q.q+'</p><div class="fb '+(ok?'ok':'bad')+'"><h3>'+(ok?'Richtig':'Nicht ganz')+'</h3><p>'+q.expl+'</p></div><button class="primary" data-act="dnext">'+(last?'Auswerten':'Nächste Aufgabe')+'</button></div>';
}
function doseNext(){
  var M=G.M;
  if(M.round>=2){
    var ok=M.right>=2&&!M.pen;
    finishMini(ok,'Dosierung sicher','Dosierung mit Fehlern',M.right+' von 3 Aufgaben richtig. Bei Kindern richtet sich die Dosis nach dem Körpergewicht, und jede Rechnung wird vor dem Verabreichen gegengeprüft.','');
    return;
  }
  M.round++;M.cur=genDose(M.round);M.val=0;M.locked=false;renderDose();
}

/* ---------- Reanimation ---------- */
var cprTick=null,cprEnd=null;
function stopCpr(){if(cprTick){clearInterval(cprTick);cprTick=null;}if(cprEnd){clearTimeout(cprEnd);cprEnd=null;}}
function runCpr(){
  G.M={kind:'cpr',step:0,pen:false,taps:[],started:false,done:false};
  var opts=shuffle([
    {t:'Ansprechen, Atmung prüfen und Notruf 112 wählen',ok:true},
    {t:'Erst Wasser holen und ins Gesicht spritzen',ok:false},
    {t:'Sofort stabile Seitenlage ohne Prüfung',ok:false},
    {t:'Warten, ob die Person von allein aufwacht',ok:false}
  ]);
  G.M.opts=opts;
  var h='<div class="panel"><h3>Reanimation</h3><p class="lead">Eine Person liegt reglos am Boden. Was tust du zuerst?</p>';
  for(var k=0;k<opts.length;k++){h+='<button class="opt" data-act="cprq" data-k="'+k+'">'+opts[k].t+'</button>';}
  h+='</div><div id="gBody"></div>';
  $('s-game').innerHTML=shell(label(),h,false);
}
function cprQuestion(k){
  var M=G.M,o=M.opts[k];
  var ok=o.ok;
  if(!ok){M.pen=true;lose();}else{beep(740,0.12);}
  var correct=M.opts.filter(function(x){return x.ok;})[0].t;
  $('s-game').querySelector('#gMain').innerHTML='<div id="gBody"><div class="fb '+(ok?'ok':'bad')+'"><h3>'+(ok?'Richtig':'Nicht ganz')+'</h3><p>Zuerst: '+correct+'. Bei fehlender normaler Atmung folgt sofort die Herzdruckmassage.</p></div><button class="primary" data-act="cprgo">Zur Herzdruckmassage</button></div>';
}
function cprGame(){
  var M=G.M;M.step=1;M.taps=[];M.started=false;M.done=false;
  $('s-game').querySelector('#gMain').innerHTML='<div id="gBody"><div class="cpr"><p class="lead" style="text-align:center">Drücke im Takt des Rings: 100 bis 120 pro Minute. Der Countdown startet beim ersten Druck.</p>'+
   '<div class="cprwrap"><div class="ring" aria-hidden="true"></div><button class="cprbtn" id="cprBtn">Drücken</button></div>'+
   '<div class="cstats" aria-live="off"><div class="v"><small>Zeit</small><b id="cT">15</b><i>s</i></div><div class="v"><small>Druck</small><b id="cN">0</b><i>mal</i></div><div class="v"><small>Tempo</small><b id="cB">0</b><i>/min</i></div></div>'+
   '<div class="qbar" role="img" aria-label="Anteil im Takt"><i id="cQ"></i></div></div></div>';
  var btn=$('cprBtn');
  btn.addEventListener('pointerdown',function(e){e.preventDefault();cprTap();});
  btn.addEventListener('keydown',function(e){if((e.key===' '||e.key==='Enter')&&!e.repeat){e.preventDefault();cprTap();}});
  cprTick=setInterval(function(){beep(900,0.03,0.025);},545);
}
function cprWindow(){var w=upLv('koffer')*0.03;return [0.45-w,0.65+w];}
function cprTap(){
  var M=G.M;if(!M||M.kind!=='cpr'||M.done)return;
  var now=performance.now()/1000;
  M.taps.push(now);
  if(!M.started){
    M.started=true;M.t0=now;
    cprEnd=setTimeout(cprFinish,15000);
    M.clock=setInterval(function(){
      var left=Math.max(0,15-(performance.now()/1000-M.t0));
      var e=$('cT');if(e)e.textContent=Math.ceil(left);
      if(left<=0)clearInterval(M.clock);
    },200);
  }
  var win=cprWindow(),good=0,n=M.taps.length;
  for(var k=1;k<n;k++){var iv=M.taps[k]-M.taps[k-1];if(iv>=win[0]&&iv<=win[1])good++;}
  var ratio=n>1?good/(n-1):0;
  var N=$('cN');if(N)N.textContent=n;
  if(n>=2){
    var rec=M.taps.slice(-5),span=rec[rec.length-1]-rec[0];
    var bpm=Math.round(60*(rec.length-1)/span);
    var B=$('cB');if(B)B.textContent=bpm;
  }
  var Q=$('cQ');if(Q){Q.style.width=Math.round(ratio*100)+'%';}
  beep(300,0.05,0.07);
}
function cprFinish(){
  var M=G.M;if(!M||M.done)return;M.done=true;stopCpr();if(M.clock)clearInterval(M.clock);
  var win=cprWindow(),n=M.taps.length,good=0;
  for(var k=1;k<n;k++){var iv=M.taps[k]-M.taps[k-1];if(iv>=win[0]&&iv<=win[1])good++;}
  var ratio=n>1?good/(n-1):0;
  var span=n>1?M.taps[n-1]-M.taps[0]:0;
  var bpm=span>0?Math.round(60*(n-1)/span):0;
  var ok=n>=18&&ratio>=0.7;
  if(!ok&&!M.pen){M.pen=true;lose();}
  var extra='<p><b>'+n+'</b> Druckmassagen, Ø <b>'+bpm+'</b> pro Minute, <b>'+Math.round(ratio*100)+' %</b> im Takt.</p>';
  finishMini(ok&&!M.pen,'Wiederbelebung gelungen','Zu unregelmäßig','Merke: 100 bis 120 Mal pro Minute, 5 bis 6 cm tief, Brustkorb nach jedem Druck ganz entlasten, möglichst ohne Pausen. Ein Defibrillator (AED) wird so früh wie möglich eingesetzt.',extra);
}

/* ---------- Ergebnis ---------- */
function showResult(o){
  var h='<div class="res"><div><span class="eyebrow">'+o.eyebrow+'</span><h2>'+o.title+'</h2></div>';
  if(o.stars!==undefined)h+=starsSvg(o.stars,'bigstars');
  h+='<div class="rows">'+o.rows.map(function(r){return '<div><span>'+r[0]+'</span><b>'+r[1]+'</b></div>';}).join('')+'</div>';
  if(o.note)h+='<p class="lead">'+o.note+'</p>';
  h+=o.btns;h+='</div>';
  $('s-result').innerHTML=h;renderTop();show('result');
}
function rankNote(){
  var r=rankOf(S.xp);
  return r>G.rank0?'Neuer Rang: '+RANKS[r][0]+'.':'';
}
function finishLevel(){
  stopAll();
  var stars=G.mistakes===0?3:(G.mistakes===1?2:1);
  var prev=S.stars[G.lvl]||0;
  if(stars>prev)S.stars[G.lvl]=stars;
  var bonus=reward(10+10*stars,10*stars);
  var next=G.lvl<12?G.lvl+1:0;
  var btns='';
  if(next)btns+='<button class="primary" data-act="lvl" data-n="'+next+'">Weiter zu Level '+next+'</button>';
  btns+='<button class="ghost" data-act="lvl" data-n="'+G.lvl+'">Level wiederholen</button><button class="ghost" data-act="tab" data-v="map">Zur Dienstkarte</button>';
  var note=rankNote();
  if(!next)note=(note?note+' ':'')+'Du hast alle zwölf Level abgeschlossen. Im Endlosdienst kannst du deinen Bestwert jagen.';
  showResult({eyebrow:'Level '+G.lvl+' · '+LEVELS[G.lvl-1].name,title:'Dienst geschafft',stars:stars,rows:[['Fehler',G.mistakes],['Geretteten Patienten',G.saved+' von 3'],['Münzen',G.coins],['Erfahrung',G.xp]],note:note,btns:btns});
  save();
}
function endRun(){
  stopAll();
  if(G.mode==='level'){
    var btns='<button class="primary" data-act="lvl" data-n="'+G.lvl+'">Level wiederholen</button><button class="ghost" data-act="tab" data-v="shop">Zur Ausstattung</button><button class="ghost" data-act="tab" data-v="map">Zur Dienstkarte</button>';
    showResult({eyebrow:'Level '+G.lvl+' · '+LEVELS[G.lvl-1].name,title:'Dienst abgebrochen',rows:[['Geretteten Patienten',G.saved],['Münzen',G.coins],['Erfahrung',G.xp]],note:'Alle Herzen sind verbraucht. Kaffeemaschine, Stethoskop und Fachbuch geben dir mehr Spielraum. '+rankNote(),btns:btns});
  }else{
    var newBest=G.saved>S.best;if(newBest)S.best=G.saved;save();
    var b2='<button class="primary" data-act="endless">Noch ein Dienst</button><button class="ghost" data-act="tab" data-v="shop">Zur Ausstattung</button><button class="ghost" data-act="tab" data-v="map">Zur Dienstkarte</button>';
    showResult({eyebrow:'Endlosdienst',title:newBest&&G.saved>0?'Neuer Bestwert':'Dienst beendet',rows:[['Geretteten Patienten',G.saved],['Bestwert',S.best],['Münzen',G.coins],['Erfahrung',G.xp]],note:rankNote(),btns:b2});
  }
}

/* ---------- Eingaben ---------- */
var ACTS={
  tab:function(b){tab(b.getAttribute('data-v'));},
  lvl:function(b){startLevel(+b.getAttribute('data-n'));},
  endless:function(){startEndless();},
  snd:function(){S.mute=!S.mute;save();renderTop();if(!S.mute)beep(660,0.1);},
  buy:function(b){
    var u=UPS.filter(function(x){return x.id===b.getAttribute('data-id');})[0],lv=upLv(u.id);
    if(lv>=u.max||S.coins<u.cost[lv])return;
    S.coins-=u.cost[lv];S.up[u.id]=lv+1;save();beep(700,0.1);renderTop();renderShop();
  },
  reset:function(b){
    if(b.getAttribute('data-arm')){S=defState();save();renderTop();renderShop();return;}
    b.setAttribute('data-arm','1');b.textContent='Wirklich alles löschen? Nochmal tippen';
    setTimeout(function(){if(b.isConnected){b.removeAttribute('data-arm');b.textContent='Spielstand löschen';}},4000);
  },
  quit:function(b){quit(b);},
  exam:function(b){
    var P=G.P,k=+b.getAttribute('data-k');
    if(P.phase!=='exam'||P.done[k]||usedPicks()>=P.picks)return;
    P.done[k]=true;beep(500,0.06);renderBody();
  },
  todx:function(){G.P.phase='dx';renderBody();},
  hint:function(){
    var P=G.P;if(G.hints<=0)return;
    var c=[];for(var k=0;k<P.dxo.length;k++){if(!P.dxo[k].ok&&!P.hide[k])c.push(k);}
    if(c.length<=1)return;
    P.hide[c[rnd(c.length)]]=true;G.hints--;renderBody();
  },
  dx:function(b){
    var P=G.P;if(P.phase!=='dx')return;
    var o=P.dxo[+b.getAttribute('data-k')];
    if(o.ok){beep(620,0.08);P.phase='tx';renderBody();}else{resolveCase('dxwrong');}
  },
  tx:function(b){
    var P=G.P;if(P.phase!=='tx')return;
    var o=P.txo[+b.getAttribute('data-k')];
    resolveCase(o.ok?'win':'txwrong');
  },
  next:function(){afterTask();},
  tri:function(b){triTap(b);},
  dminus:function(){doseStep(-1);},
  dplus:function(){doseStep(1);},
  dok:function(){doseOk();},
  dnext:function(){doseNext();},
  cprq:function(b){
    if(G.M.step!==0||G.M.answered)return;G.M.answered=true;cprQuestion(+b.getAttribute('data-k'));
  },
  cprgo:function(){cprGame();}
};
document.addEventListener('click',function(e){
  var b=e.target.closest?e.target.closest('[data-act]'):null;
  if(!b||b.disabled)return;
  var f=ACTS[b.getAttribute('data-act')];
  if(f)f(b,e);
});

/* ---------- Start ---------- */
renderTop();renderMap();show('map');
window.__kd={CASES:CASES,LEVELS:LEVELS,TRI:TRI};
})();
</script>
